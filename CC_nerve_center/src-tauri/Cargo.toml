[package]
name = "ghs-nerve-center"
version = "1.0.0"
description = "GHS Autonomous Operations Platform — Mission Control"
authors = ["Gold Health Systems"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "1", features = [
  "system-tray",
  "http-all",
  "shell-open"
] }
open = "5"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
